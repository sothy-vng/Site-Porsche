<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Connexion </title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <form id="loginForm">
        <h2> Connectez-vous avec votre Porsche ID. </h2>

        <!-- Étape 1 : Email -->
        <div id="step-email">
            <label for="email"> Porsche ID (e-mail) :</label>
            <input type="email" id="email" name="email" required>
            <p id="error-email" style="color: red; display: none; font-size: 14px;"> Veuillez saisir une adresse e-mail
                valide. </p>
            <button type="button" id="btn-next"> Continuer </button>
        </div>

        <!-- Étape 2 : Mot de passe (caché au départ) -->
        <div id="step-password" style="display: none;">
            <p id="email-summary"> Connecté en tant que : <strong id="display-email"></strong>
                <a href="#" id="btn-back" title="Modifier l'adresse e-mail"
                    style="display: inline-flex; align-items: center; vertical-align: middle; margin-left: 6px; color: inherit;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                    </svg>
                </a>
            </p>
            <label for="password"> Mot de passe :</label>
            <input type="password" id="password" name="password">
            <button type="submit"> Confirmer </button>
        </div>

        <p> Vous n'avez pas de Porsche ID ? <a href="Sign in/sign in.html"> Créez-en un </a></p>
    </form>
</body>

</html>
